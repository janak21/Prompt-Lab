[project]
name = "promptlab"
version = "0.1.0"
description = "Local prompt-evaluation tool"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# Live-API tests (backend/tests/test_live_api.py) make real calls to the Anthropic API
# and cost real money -- they are deselected by default. Run them explicitly with
# `PROMPTLAB_LIVE_TESTS=1 uv run pytest -m live backend/tests/test_live_api.py`
# (the test file also self-skips without the env var, as a second guard).
addopts = "-m \"not live\""
markers = [
    "live: makes real Anthropic API calls -- opt-in only, never runs in a default `pytest` invocation or in CI (see backend/tests/test_live_api.py)",
]

[project.scripts]
promptlab = "backend.app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
